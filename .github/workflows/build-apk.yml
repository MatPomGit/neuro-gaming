name: Build Android APK

# ─────────────────────────────────────────────────────────────────────────────
# Trigger: manual dispatch only (workflow_dispatch).
# Optional input allows choosing debug or release mode.
# ─────────────────────────────────────────────────────────────────────────────
on:
  workflow_dispatch:
    inputs:
      build_mode:
        description: "Build mode"
        required: false
        default: "debug"
        type: choice
        options:
          - debug
          - release
      publish_prerelease:
        description: "Publish this APK as a durable technical prerelease"
        required: true
        default: false
        type: boolean
      release_tag:
        description: "Release tag, e.g. neuro-gaming-v1.3.0-rc1; required when publishing"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  build-apk:
    name: Build APK (${{ github.event.inputs.build_mode || 'debug' }})
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      # ── 1. Check out source ────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Set up Python ──────────────────────────────────────────────────
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # ── 3. System dependencies required by Buildozer / p4a ────────────────
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            ccache \
            git \
            libffi-dev \
            libssl-dev \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libreadline-dev \
            libsqlite3-dev \
            libgdbm-dev \
            libbz2-dev \
            libexpat1-dev \
            liblzma-dev \
            python3-dev \
            openjdk-17-jdk \
            unzip \
            zip \
            autoconf \
            libtool \
            pkg-config \
            cmake \
            ninja-build \
            lld

      # ── 4. Cache buildozer global directory ───────────────────────────────
      - name: Cache Buildozer global state
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            ${{ runner.os }}-buildozer-

      # ── 5. Cache Android SDK / NDK downloads ──────────────────────────────
      - name: Cache Android SDK / NDK
        uses: actions/cache@v4
        with:
          path: ~/.android
          key: ${{ runner.os }}-android-sdk-ndk-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            ${{ runner.os }}-android-sdk-ndk-

      # ── 6. Install Buildozer + Cython ─────────────────────────────────────
      - name: Install Buildozer and Cython
        run: |
          python -m pip install --upgrade pip wheel
          pip install buildozer "cython<3.0"

      # ── 7. Accept Android SDK licenses ────────────────────────────────────
      - name: Accept Android SDK licenses
        run: |
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses || true

      # ── 8. Build the APK ──────────────────────────────────────────────────
      - name: Build APK
        env:
          # Ensure ccache is used for faster rebuilds
          USE_SDK_WRAPPER: 1
        run: |
          buildozer android ${{ github.event.inputs.build_mode || 'debug' }}

      # ── 9. Upload APK artifact ────────────────────────────────────────────
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: neuro-gaming-${{ github.event.inputs.build_mode || 'debug' }}-apk
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 3

  publish-prerelease:
    name: Publish technical prerelease
    needs: build-apk
    if: ${{ inputs.publish_prerelease }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Validate release tag
        shell: bash
        run: |
          test -n "${{ inputs.release_tag }}" || {
            echo "::error::release_tag is required when publish_prerelease=true"
            exit 2
          }

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: neuro-gaming-${{ inputs.build_mode }}-apk
          path: release

      - name: Generate SHA-256 manifest
        shell: bash
        run: |
          cd release
          sha256sum *.apk > SHA256SUMS.txt

      - name: Publish GitHub prerelease
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.release_tag }}
          target_commitish: ${{ github.sha }}
          name: "NeuroGaming 1.3.0 technical prerelease"
          prerelease: true
          body: |
            Reproducible APK snapshot for NeuroGaming 1.3.0.
            Build mode: ${{ inputs.build_mode }}.
            The repository's Python and Buildozer version metadata are aligned to 1.3.0.
          files: |
            release/*.apk
            release/SHA256SUMS.txt

      - name: Delete transient Actions artifact
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.workflow_run.id == ${{ github.run_id }}) | .id' \
          | while read -r artifact_id; do
              [ -z "$artifact_id" ] && continue
              gh api --method DELETE \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "repos/${GITHUB_REPOSITORY}/actions/artifacts/$artifact_id"
            done
